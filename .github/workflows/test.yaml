name: "CI - Test Features"

on:
  pull_request:
    paths:
      - "src/**"
      - "test/**"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: ["kind", "kustomize"]
        baseImage:
          - "mcr.microsoft.com/devcontainers/base:ubuntu"
          - "mcr.microsoft.com/devcontainers/base:debian"
    steps:
      - uses: actions/checkout@v7

      - name: "Install devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Test '${{ matrix.feature }}' against '${{ matrix.baseImage }}'"
        run: devcontainer features test --skip-scenarios -f ${{ matrix.feature }} -i ${{ matrix.baseImage }} .

  test-scenarios:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: ["kind", "kustomize"]
    steps:
      - uses: actions/checkout@v7

      - name: "Install devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Test '${{ matrix.feature }}' scenarios"
        run: devcontainer features test -f ${{ matrix.feature }} --skip-autogenerated .

  tests-passed:
    name: "All tests passed"
    needs: [test, test-scenarios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: "Check matrix results"
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.test-scenarios.result }}" != "success" ]; then
            echo "One or more test jobs did not succeed."
            exit 1
          fi
